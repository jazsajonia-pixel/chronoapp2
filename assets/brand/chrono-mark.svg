<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="480" height="480">
  <!-- Chrono mark: an open C ring (time) and a forward chevron (the next command).
       One geometric construction, round caps. Ember #FF7A3C on transparent; the group is shifted
       3 units right so the open ring reads optically centred. Colour variants are generated by
       scripts/make-icons.py; src/ui/brand.tsx draws the same paths. -->
  <g transform="translate(3 0)" fill="none" stroke="#FF7A3C" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86.97 33.95A37.5 37.5 0 1 0 86.97 86.05" stroke-width="17"/>
    <path d="M56.5 46L76 60L56.5 74" stroke-width="12.5"/>
  </g>
</svg>
